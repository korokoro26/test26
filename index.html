<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="PadNote" />
  <meta name="theme-color" content="#F2F2F7" />
  <title>PadNote - iPad専用手書きノート</title>

  <!-- Tailwind CSS (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- jsPDF (CDN) for PDF Export -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    /* Apple HIG 準拠 & iPad / iOS タッチ・ペン最適化 */
    :root {
      --bg-grouped: #F2F2F7;
      --bg-elevated: #FFFFFF;
      --label-primary: #1C1C1E;
      --label-secondary: #8E8E93;
      --separator: rgba(60, 60, 67, 0.14);
      --accent-blue: #007AFF;
      --accent-red: #FF3B30;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      user-select: none;
      -webkit-user-select: none;
    }

    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-grouped);
      color: var(--label-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    /* Safe Area 対応 */
    .safe-top {
      padding-top: env(safe-area-inset-top, 0px);
    }
    .safe-bottom {
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* 44px以上の最小タップ領域保証 (Apple HIG) */
    .hig-btn {
      min-width: 44px;
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s ease, background-color 0.15s ease, opacity 0.15s ease;
    }
    .hig-btn:active:not(:disabled) {
      transform: scale(0.94);
      opacity: 0.78;
    }
    .hig-btn:disabled {
      opacity: 0.35;
      pointer-events: none;
    }

    /* キャンバス描画領域：ブラウザ標準のスクロール・ズームを完全遮断 */
    #drawingCanvas {
      touch-action: none;
      cursor: crosshair;
      display: block;
    }

    /* 用紙テンプレート背景パターン（表示用CSS / PDF出力時はCanvasに合成描画） */
    .paper-plain {
      background-color: #FFFFFF;
    }
    .paper-grid {
      background-color: #FFFFFF;
      background-image:
        linear-gradient(to right, rgba(0, 122, 255, 0.09) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 122, 255, 0.09) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .paper-ruled {
      background-color: #FFFFFF;
      background-image:
        linear-gradient(to bottom, transparent 35px, rgba(0, 122, 255, 0.14) 36px);
      background-size: 100% 36px;
    }

    /* カスタムスクロールバー（ノート一覧モーダル内） */
    .ios-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .ios-scroll::-webkit-scrollbar-thumb {
      background-color: rgba(60, 60, 67, 0.2);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="flex flex-col h-screen w-screen bg-[#F2F2F7]">

  <!-- トップナビゲーションバー (Apple HIG 半透明ブラー) -->
  <header class="safe-top bg-white/85 backdrop-blur-xl border-b border-black/10 z-20 shrink-0">
    <div class="h-14 px-3 sm:px-5 flex items-center justify-between gap-2">
      <!-- 左側: ノート一覧ドロワーボタン & タイトル編集 -->
      <div class="flex items-center gap-1.5 min-w-0 flex-1">
        <button id="btnOpenNotes" class="hig-btn rounded-xl text-[#007AFF] hover:bg-black/5 px-2.5 gap-1.5" title="ノート一覧">
          <i data-lucide="folder-open" class="w-5 h-5"></i>
          <span class="hidden sm:inline text-[15px] font-medium">一覧</span>
        </button>

        <div class="h-5 w-[1px] bg-black/10 mx-1"></div>

        <!-- ノートタイトル入力 (Shift+Enterで確定 / Enterは変換確定のみ) -->
        <input
          id="noteTitleInput"
          type="text"
          value="無題のノート"
          placeholder="ノートタイトル..."
          aria-label="ノートタイトル"
          class="bg-transparent text-[17px] font-semibold text-[#1C1C1E] tracking-tight truncate px-2 py-1.5 rounded-lg focus:outline-none focus:bg-black/5 w-full max-w-[260px] sm:max-w-xs"
        />
      </div>

      <!-- 中央: ページネーション (複数ページ対応) -->
      <div class="flex items-center bg-[#F2F2F7] rounded-xl p-0.5 border border-black/5">
        <button id="btnPrevPage" class="hig-btn !min-w-[38px] !min-h-[38px] rounded-lg text-[#1C1C1E] hover:bg-white/80" title="前のページ">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <span id="pageIndicator" class="px-2.5 text-[13px] font-semibold tabular-nums text-[#1C1C1E] min-w-[54px] text-center">
          1 / 1
        </span>
        <button id="btnNextPage" class="hig-btn !min-w-[38px] !min-h-[38px] rounded-lg text-[#1C1C1E] hover:bg-white/80" title="次のページ">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
        <button id="btnAddPage" class="hig-btn !min-w-[38px] !min-h-[38px] rounded-lg text-[#007AFF] hover:bg-white/80 ml-0.5" title="新規ページ追加">
          <i data-lucide="file-plus-2" class="w-4 h-4"></i>
        </button>
        <button id="btnDeletePage" class="hig-btn !min-w-[38px] !min-h-[38px] rounded-lg text-[#FF3B30] hover:bg-white/80" title="現在のページを削除">
          <i data-lucide="file-minus-2" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- 右側: Undo/Redo & 用紙切替 & 簡易PDF出力 -->
      <div class="flex items-center gap-1 sm:gap-1.5">
        <button id="btnUndo" class="hig-btn rounded-xl text-[#1C1C1E] hover:bg-black/5" title="取り消す (Undo)">
          <i data-lucide="undo-2" class="w-5 h-5"></i>
        </button>
        <button id="btnRedo" class="hig-btn rounded-xl text-[#1C1C1E] hover:bg-black/5" title="やり直す (Redo)">
          <i data-lucide="redo-2" class="w-5 h-5"></i>
        </button>

        <div class="h-5 w-[1px] bg-black/10 mx-0.5 hidden sm:block"></div>

        <!-- 用紙スタイル切替 -->
        <button id="btnPaperStyle" class="hig-btn rounded-xl text-[#1C1C1E] hover:bg-black/5 px-2.5 gap-1" title="用紙パターン切替">
          <i data-lucide="grid" class="w-5 h-5 text-[#8E8E93]"></i>
          <span id="paperStyleLabel" class="hidden md:inline text-[13px] font-medium text-[#3A3A3C]">方眼</span>
        </button>

        <!-- PDF出力ボタン -->
        <button id="btnExportPdf" class="hig-btn rounded-xl bg-[#007AFF] text-white font-semibold text-[14px] px-3.5 gap-1.5 shadow-sm hover:bg-[#0066D6]">
          <i data-lucide="share" class="w-4 h-4"></i>
          <span>PDF出力</span>
        </button>
      </div>
    </div>
  </header>

  <!-- メインキャンバスエリア (iPad横向き・縦向き両対応のA4比率シート) -->
  <main id="canvasViewport" class="flex-1 relative flex items-center justify-center p-3 sm:p-6 overflow-hidden">
    <!-- 用紙コンテナ -->
    <div id="paperContainer" class="relative bg-white rounded-2xl shadow-[0_8px_30px_rgba(0,0,0,0.08)] border border-black/10 overflow-hidden transition-all duration-200">
      <canvas id="drawingCanvas" class="paper-grid"></canvas>

      <!-- Apple Pencil 専用モードバッジ (右下隅に控えめに配置) -->
      <button id="btnPalmReject" class="absolute bottom-3 right-3 px-2.5 py-1.5 rounded-full bg-black/5 backdrop-blur-md text-[11px] font-medium text-[#8E8E93] flex items-center gap-1.5 hover:bg-black/10 transition" title="指での誤タッチ防止モード切替">
        <i data-lucide="pen-tool" class="w-3.5 h-3.5 text-[#007AFF]"></i>
        <span id="palmRejectText">Pencil + 指</span>
      </button>
    </div>

    <!-- フローティングツールパレット (Apple PencilKit 風) -->
    <div class="fixed bottom-5 safe-bottom left-1/2 -translate-x-1/2 z-30 bg-white/90 backdrop-blur-2xl border border-black/10 shadow-[0_10px_32px_rgba(0,0,0,0.12)] rounded-full px-3 py-1.5 flex items-center gap-1 sm:gap-2">
      <!-- ペンツール -->
      <button data-tool="pen" class="tool-btn hig-btn rounded-full px-3 gap-1.5 bg-[#007AFF]/12 text-[#007AFF] font-semibold" title="ボールペン">
        <i data-lucide="pen" class="w-5 h-5"></i>
      </button>

      <!-- 蛍光マーカーツール -->
      <button data-tool="highlighter" class="tool-btn hig-btn rounded-full px-3 gap-1.5 text-[#3A3A3C] hover:bg-black/5" title="蛍光マーカー">
        <i data-lucide="highlighter" class="w-5 h-5"></i>
      </button>

      <!-- 消しゴムツール -->
      <button data-tool="eraser" class="tool-btn hig-btn rounded-full px-3 gap-1.5 text-[#3A3A3C] hover:bg-black/5" title="消しゴム">
        <i data-lucide="eraser" class="w-5 h-5"></i>
      </button>

      <div class="h-6 w-[1px] bg-black/10 mx-0.5"></div>

      <!-- カラーパレット -->
      <div class="flex items-center gap-1.5 px-1">
        <button data-color="#1C1C1E" class="color-btn w-8 h-8 rounded-full bg-[#1C1C1E] ring-2 ring-offset-2 ring-[#007AFF] transition-transform active:scale-90" aria-label="ブラック"></button>
        <button data-color="#007AFF" class="color-btn w-8 h-8 rounded-full bg-[#007AFF] transition-transform active:scale-90" aria-label="ブルー"></button>
        <button data-color="#FF3B30" class="color-btn w-8 h-8 rounded-full bg-[#FF3B30] transition-transform active:scale-90" aria-label="レッド"></button>
        <button data-color="#34C759" class="color-btn w-8 h-8 rounded-full bg-[#34C759] transition-transform active:scale-90" aria-label="グリーン"></button>
        <button data-color="#FF9500" class="color-btn w-8 h-8 rounded-full bg-[#FF9500] transition-transform active:scale-90" aria-label="オレンジ"></button>
      </div>

      <div class="h-6 w-[1px] bg-black/10 mx-0.5"></div>

      <!-- 線幅切替 (細・中・太) -->
      <div class="flex items-center gap-1">
        <button data-size="2" class="size-btn hig-btn !min-w-[38px] !min-h-[38px] rounded-full bg-black/8 text-[#1C1C1E]" title="細字">
          <span class="w-1.5 h-1.5 rounded-full bg-current"></span>
        </button>
        <button data-size="4.5" class="size-btn hig-btn !min-w-[38px] !min-h-[38px] rounded-full text-[#8E8E93] hover:bg-black/5" title="中字">
          <span class="w-2.5 h-2.5 rounded-full bg-current"></span>
        </button>
        <button data-size="9" class="size-btn hig-btn !min-w-[38px] !min-h-[38px] rounded-full text-[#8E8E93] hover:bg-black/5" title="太字">
          <span class="w-4 h-4 rounded-full bg-current"></span>
        </button>
      </div>

      <div class="h-6 w-[1px] bg-black/10 mx-0.5"></div>

      <!-- ページ全消去ボタン -->
      <button id="btnClearCanvas" class="hig-btn rounded-full text-[#FF3B30] hover:bg-[#FF3B30]/10" title="このページをクリア">
        <i data-lucide="trash-2" class="w-5 h-5"></i>
      </button>
    </div>

    <!-- 低視認性バージョン表記 (要件準拠) -->
    <div class="fixed bottom-1.5 left-3 text-[10px] text-black/25 pointer-events-none select-none font-mono">
      v1.0.0
    </div>
  </main>

  <!-- ノート一覧 & CRUD管理モーダル (モーダル外タップで閉じる仕様) -->
  <div id="notesModalOverlay" class="fixed inset-0 z-50 bg-black/35 backdrop-blur-xs hidden items-center justify-center p-4">
    <div id="notesModalCard" class="bg-[#F2F2F7] w-full max-w-lg rounded-3xl shadow-2xl border border-black/10 overflow-hidden flex flex-col max-h-[82vh]">
      <!-- モーダルヘッダー -->
      <div class="bg-white px-5 py-3.5 border-b border-black/10 flex items-center justify-between">
        <h2 class="text-[17px] font-bold text-[#1C1C1E]">ノート一覧</h2>
        <div class="flex items-center gap-2">
          <button id="btnCreateNewNote" class="hig-btn rounded-xl bg-[#007AFF] text-white px-3.5 text-[14px] font-semibold gap-1.5">
            <i data-lucide="plus" class="w-4 h-4"></i>
            <span>新規ノート</span>
          </button>
          <button id="btnCloseNotesModal" class="hig-btn rounded-full bg-[#F2F2F7] text-[#8E8E93] hover:text-[#1C1C1E]" aria-label="閉じる">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- ノートリスト本体 -->
      <div id="notesListContainer" class="p-4 overflow-y-auto ios-scroll space-y-2.5 flex-1">
        <!-- JSで動的に描画 -->
      </div>
    </div>
  </div>

  <!-- 処理中オーバーレイ (体感レイテンシ低減フィードバック) -->
  <div id="loadingToast" class="fixed top-18 left-1/2 -translate-x-1/2 z-50 bg-[#1C1C1E]/85 text-white backdrop-blur-md px-4 py-2 rounded-full text-[13px] font-medium shadow-lg hidden items-center gap-2">
    <span class="w-2 h-2 rounded-full bg-[#34C759] animate-ping"></span>
    <span id="loadingToastText">PDFを生成中...</span>
  </div>

  <script>
    /**
     * PadNote MVP - iPad専用手書きノート & 簡易PDF出力アプリ
     * 特徴:
     * - Pointer Events API による Apple Pencil 筆圧(pressure) & パームリジェクション対応
     * - IndexedDB による完全ローカル永続化 (リロード後も保持 / CRUD完備)
     * - Single File PWA (動的Manifest生成)
     * - jsPDF による全ページ一括PDF出力
     */

    // ==========================================
    // 1. PWA Manifest 動的生成 (Single File PWA)
    // ==========================================
    (function setupDynamicPWA() {
      try {
        const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="#007AFF"/><path d="M160 352l32-96 144-144c12-12 32-12 44 0l20 20c12 12 12 32 0 44L256 320l-96 32z" fill="#FFFFFF"/></svg>`;
        const iconUrl = 'data:image/svg+xml;base64,' + btoa(svgIcon);
        const manifest = {
          name: 'PadNote - iPad手書きノート',
          short_name: 'PadNote',
          start_url: '.',
          display: 'standalone',
          background_color: '#F2F2F7',
          theme_color: '#F2F2F7',
          icons: [{ src: iconUrl, sizes: '512x512', type: 'image/svg+xml' }]
        };
        const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = URL.createObjectURL(blob);
        document.head.appendChild(link);
      } catch (e) {
        console.warn('PWA Manifest init skipped:', e);
      }
    })();

    // ==========================================
    // 2. IndexedDB 永続化マネージャー (CRUD完備)
    // ==========================================
    const DB_NAME = 'PadNoteDB_v1';
    const STORE_NAME = 'notes';
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const database = e.target.result;
          if (!database.objectStoreNames.contains(STORE_NAME)) {
            database.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        req.onerror = (e) => {
          alert('ローカルデータベースの初期化に失敗しました: ' + (e.target.error?.message || '不明なエラー'));
          reject(e.target.error);
        };
      });
    }

    // Create / Update
    function saveNoteToDB(note) {
      return new Promise((resolve, reject) => {
        if (!db) return reject(new Error('DB未初期化'));
        note.updatedAt = Date.now();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.put(note);
        req.onsuccess = () => resolve(note);
        req.onerror = (e) => {
          alert('ノートの保存に失敗しました: ' + (e.target.error?.message || 'ストレージ容量を確認してください'));
          reject(e.target.error);
        };
      });
    }

    // Read All
    function getAllNotesFromDB() {
      return new Promise((resolve, reject) => {
        if (!db) return reject(new Error('DB未初期化'));
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();
        req.onsuccess = () => {
          const list = req.result || [];
          list.sort((a, b) => b.updatedAt - a.updatedAt);
          resolve(list);
        };
        req.onerror = (e) => {
          alert('ノート一覧の読み込みに失敗しました: ' + (e.target.error?.message || ''));
          reject(e.target.error);
        };
      });
    }

    // Delete
    function deleteNoteFromDB(id) {
      return new Promise((resolve, reject) => {
        if (!db) return reject(new Error('DB未初期化'));
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        const req = store.delete(id);
        req.onsuccess = () => resolve();
        req.onerror = (e) => {
          alert('ノートの削除に失敗しました: ' + (e.target.error?.message || ''));
          reject(e.target.error);
        };
      });
    }

    // ==========================================
    // 3. アプリケーション状態管理
    // ==========================================
    // 内部論理解像度 (A4縦比率ベース: 高精細描画用)
    const LOGICAL_WIDTH = 1240;
    const LOGICAL_HEIGHT = 1754;

    const state = {
      notes: [],
      currentNote: null,
      currentPageIndex: 0,
      tool: 'pen',          // 'pen' | 'highlighter' | 'eraser'
      color: '#1C1C1E',
      baseSize: 2,
      pencilOnly: false,    // true の場合 Apple Pencil (pointerType === 'pen') のみ描画許可
      isDrawing: false,
      currentStroke: null,
      redoStack: []         // ページごとのやり直しスタック
    };

    const canvas = document.getElementById('drawingCanvas');
    const ctx = canvas.getContext('2d');
    const paperContainer = document.getElementById('paperContainer');
    const viewport = document.getElementById('canvasViewport');

    // 新規ノートオブジェクト生成ヘルパー
    function createEmptyNote(title = '無題のノート') {
      return {
        id: 'note_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6),
        title,
        paperStyle: 'grid', // 'plain' | 'grid' | 'ruled'
        pages: [
          { strokes: [] }
        ],
        createdAt: Date.now(),
        updatedAt: Date.now()
      };
    }

    // ==========================================
    // 4. キャンバスサイズ調整 & 描画エンジン
    // ==========================================
    function resizePaperLayout() {
      const vw = viewport.clientWidth - 24;
      const vh = viewport.clientHeight - 84; // 下部ツールバー分の余白確保
      const aspect = LOGICAL_WIDTH / LOGICAL_HEIGHT;

      let displayW = vw;
      let displayH = vw / aspect;

      if (displayH > vh) {
        displayH = vh;
        displayW = vh * aspect;
      }

      paperContainer.style.width = `${Math.floor(displayW)}px`;
      paperContainer.style.height = `${Math.floor(displayH)}px`;

      canvas.width = LOGICAL_WIDTH;
      canvas.height = LOGICAL_HEIGHT;
      canvas.style.width = '100%';
      canvas.style.height = '100%';

      redrawCanvas();
    }

    // ストローク1本を描画する関数
    function renderStroke(targetCtx, stroke) {
      if (!stroke || !stroke.points || stroke.points.length === 0) return;

      targetCtx.save();
      targetCtx.lineCap = 'round';
      targetCtx.lineJoin = 'round';

      if (stroke.tool === 'eraser') {
        targetCtx.globalCompositeOperation = 'destination-out';
        targetCtx.strokeStyle = 'rgba(0,0,0,1)';
        targetCtx.globalAlpha = 1.0;
      } else if (stroke.tool === 'highlighter') {
        targetCtx.globalCompositeOperation = 'multiply';
        targetCtx.strokeStyle = stroke.color;
        targetCtx.globalAlpha = 0.28;
      } else {
        targetCtx.globalCompositeOperation = 'source-over';
        targetCtx.strokeStyle = stroke.color;
        targetCtx.globalAlpha = 1.0;
      }

      const pts = stroke.points;
      const baseWidth = stroke.tool === 'highlighter' ? stroke.size * 5.5
                      : stroke.tool === 'eraser' ? stroke.size * 6
                      : stroke.size * 1.8;

      if (pts.length === 1) {
        targetCtx.beginPath();
        const r = Math.max(1, (baseWidth * (pts[0].p || 0.5)) / 2);
        targetCtx.fillStyle = stroke.tool === 'eraser' ? 'rgba(0,0,0,1)' : stroke.color;
        targetCtx.arc(pts[0].x, pts[0].y, r, 0, Math.PI * 2);
        targetCtx.fill();
        targetCtx.restore();
        return;
      }

      // 筆圧に応じた滑らかなベジェ補間描画
      for (let i = 1; i < pts.length; i++) {
        const p0 = pts[i - 1];
        const p1 = pts[i];
        const pressure = stroke.tool === 'pen' ? (0.45 + (p1.p || 0.5) * 0.9) : 1.0;
        targetCtx.lineWidth = Math.max(1.2, baseWidth * pressure);

        targetCtx.beginPath();
        targetCtx.moveTo(p0.x, p0.y);
        const midX = (p0.x + p1.x) / 2;
        const midY = (p0.y + p1.y) / 2;
        targetCtx.quadraticCurveTo(p0.x, p0.y, midX, midY);
        targetCtx.lineTo(p1.x, p1.y);
        targetCtx.stroke();
      }

      targetCtx.restore();
    }

    // 現在のページ全体を再描画
    function redrawCanvas() {
      ctx.clearRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);
      if (!state.currentNote) return;

      const page = state.currentNote.pages[state.currentPageIndex];
      if (!page) return;

      for (const stroke of page.strokes) {
        renderStroke(ctx, stroke);
      }
      if (state.currentStroke) {
        renderStroke(ctx, state.currentStroke);
      }
    }

    // 画面座標をキャンバス論理座標へ変換
    function getCanvasCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = LOGICAL_WIDTH / rect.width;
      const scaleY = LOGICAL_HEIGHT / rect.height;
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY,
        p: typeof e.pressure === 'number' && e.pressure > 0 ? e.pressure : 0.5
      };
    }

    // ==========================================
    // 5. Pointer Events (Apple Pencil & タッチ制御)
    // ==========================================
    canvas.addEventListener('pointerdown', (e) => {
      // Apple Pencil 専用モード時の指タッチ無視
      if (state.pencilOnly && e.pointerType !== 'pen') return;
      if (e.button !== 0 && e.pointerType === 'mouse') return;

      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);

      state.isDrawing = true;
      const pt = getCanvasCoords(e);
      state.currentStroke = {
        tool: state.tool,
        color: state.color,
        size: state.baseSize,
        points: [pt]
      };
      redrawCanvas();
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!state.isDrawing || !state.currentStroke) return;
      if (state.pencilOnly && e.pointerType !== 'pen') return;

      e.preventDefault();
      // 高頻度イベント (coalescedEvents) を取得してApple Pencilの曲線を滑らかにする
      const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
      for (const ev of events) {
        state.currentStroke.points.push(getCanvasCoords(ev));
      }
      redrawCanvas();
    });

    async function finishStroke(e) {
      if (!state.isDrawing) return;
      state.isDrawing = false;
      if (e && canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }

      if (state.currentStroke && state.currentStroke.points.length > 0) {
        const page = state.currentNote.pages[state.currentPageIndex];
        page.strokes.push(state.currentStroke);
        state.currentStroke = null;
        state.redoStack = [];
        updateUIState();
        await saveNoteToDB(state.currentNote);
      }
    }

    canvas.addEventListener('pointerup', finishStroke);
    canvas.addEventListener('pointercancel', finishStroke);

    // ==========================================
    // 6. UI 更新 & ツール・ページ・用紙操作
    // ==========================================
    function updateUIState() {
      if (!state.currentNote) return;

      // タイトル
      const titleInput = document.getElementById('noteTitleInput');
      if (document.activeElement !== titleInput) {
        titleInput.value = state.currentNote.title;
      }

      // ページ番号
      const total = state.currentNote.pages.length;
      const current = state.currentPageIndex + 1;
      document.getElementById('pageIndicator').textContent = `${current} / ${total}`;
      document.getElementById('btnPrevPage').disabled = state.currentPageIndex === 0;
      document.getElementById('btnNextPage').disabled = state.currentPageIndex >= total - 1;
      document.getElementById('btnDeletePage').disabled = total <= 1;

      // Undo / Redo
      const page = state.currentNote.pages[state.currentPageIndex];
      document.getElementById('btnUndo').disabled = !page || page.strokes.length === 0;
      document.getElementById('btnRedo').disabled = state.redoStack.length === 0;

      // 用紙パターン適用
      canvas.classList.remove('paper-plain', 'paper-grid', 'paper-ruled');
      const styleMap = {
        plain: { cls: 'paper-plain', label: '無地' },
        grid: { cls: 'paper-grid', label: '方眼' },
        ruled: { cls: 'paper-ruled', label: '横罫' }
      };
      const currentStyle = styleMap[state.currentNote.paperStyle] || styleMap.grid;
      canvas.classList.add(currentStyle.cls);
      document.getElementById('paperStyleLabel').textContent = currentStyle.label;
    }

    // ツール選択
    document.querySelectorAll('.tool-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.tool = btn.dataset.tool;
        document.querySelectorAll('.tool-btn').forEach(b => {
          b.classList.remove('bg-[#007AFF]/12', 'text-[#007AFF]', 'font-semibold');
          b.classList.add('text-[#3A3A3C]');
        });
        btn.classList.add('bg-[#007AFF]/12', 'text-[#007AFF]', 'font-semibold');
        btn.classList.remove('text-[#3A3A3C]');
      });
    });

    // 色選択
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.color = btn.dataset.color;
        if (state.tool === 'eraser') {
          document.querySelector('[data-tool="pen"]').click();
        }
        document.querySelectorAll('.color-btn').forEach(b => {
          b.classList.remove('ring-2', 'ring-offset-2', 'ring-[#007AFF]');
        });
        btn.classList.add('ring-2', 'ring-offset-2', 'ring-[#007AFF]');
      });
    });

    // 線幅選択
    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        state.baseSize = parseFloat(btn.dataset.size);
        document.querySelectorAll('.size-btn').forEach(b => {
          b.classList.remove('bg-black/8', 'text-[#1C1C1E]');
          b.classList.add('text-[#8E8E93]');
        });
        btn.classList.add('bg-black/8', 'text-[#1C1C1E]');
        btn.classList.remove('text-[#8E8E93]');
      });
    });

    // Apple Pencil 専用モード切替
    document.getElementById('btnPalmReject').addEventListener('click', () => {
      state.pencilOnly = !state.pencilOnly;
      const badge = document.getElementById('btnPalmReject');
      const label = document.getElementById('palmRejectText');
      if (state.pencilOnly) {
        badge.classList.add('bg-[#007AFF]/15', 'text-[#007AFF]');
        badge.classList.remove('bg-black/5', 'text-[#8E8E93]');
        label.textContent = 'Pencil専用';
      } else {
        badge.classList.remove('bg-[#007AFF]/15', 'text-[#007AFF]');
        badge.classList.add('bg-black/5', 'text-[#8E8E93]');
        label.textContent = 'Pencil + 指';
      }
    });

    // Undo / Redo
    document.getElementById('btnUndo').addEventListener('click', async () => {
      const page = state.currentNote.pages[state.currentPageIndex];
      if (!page || page.strokes.length === 0) return;
      const popped = page.strokes.pop();
      state.redoStack.push(popped);
      redrawCanvas();
      updateUIState();
      await saveNoteToDB(state.currentNote);
    });

    document.getElementById('btnRedo').addEventListener('click', async () => {
      if (state.redoStack.length === 0) return;
      const page = state.currentNote.pages[state.currentPageIndex];
      const restored = state.redoStack.pop();
      page.strokes.push(restored);
      redrawCanvas();
      updateUIState();
      await saveNoteToDB(state.currentNote);
    });

    // ページクリア
    document.getElementById('btnClearCanvas').addEventListener('click', async () => {
      const page = state.currentNote.pages[state.currentPageIndex];
      if (!page || page.strokes.length === 0) return;
      if (!confirm('現在のページの手書き内容をすべて消去しますか？')) return;
      page.strokes = [];
      state.redoStack = [];
      redrawCanvas();
      updateUIState();
      await saveNoteToDB(state.currentNote);
    });

    // ページ移動・追加・削除
    document.getElementById('btnPrevPage').addEventListener('click', () => {
      if (state.currentPageIndex > 0) {
        state.currentPageIndex--;
        state.redoStack = [];
        redrawCanvas();
        updateUIState();
      }
    });

    document.getElementById('btnNextPage').addEventListener('click', () => {
      if (state.currentPageIndex < state.currentNote.pages.length - 1) {
        state.currentPageIndex++;
        state.redoStack = [];
        redrawCanvas();
        updateUIState();
      }
    });

    document.getElementById('btnAddPage').addEventListener('click', async () => {
      state.currentNote.pages.splice(state.currentPageIndex + 1, 0, { strokes: [] });
      state.currentPageIndex++;
      state.redoStack = [];
      redrawCanvas();
      updateUIState();
      await saveNoteToDB(state.currentNote);
    });

    document.getElementById('btnDeletePage').addEventListener('click', async () => {
      if (state.currentNote.pages.length <= 1) return;
      if (!confirm('このページを削除しますか？')) return;
      state.currentNote.pages.splice(state.currentPageIndex, 1);
      if (state.currentPageIndex >= state.currentNote.pages.length) {
        state.currentPageIndex = state.currentNote.pages.length - 1;
      }
      state.redoStack = [];
      redrawCanvas();
      updateUIState();
      await saveNoteToDB(state.currentNote);
    });

    // 用紙パターン切替
    document.getElementById('btnPaperStyle').addEventListener('click', async () => {
      const order = ['grid', 'ruled', 'plain'];
      const nextIdx = (order.indexOf(state.currentNote.paperStyle) + 1) % order.length;
      state.currentNote.paperStyle = order[nextIdx];
      updateUIState();
      await saveNoteToDB(state.currentNote);
    });

    // タイトル変更 (誤操作防止: Shift+Enterで確定、通常のEnterはIME確定を妨げない)
    const titleInput = document.getElementById('noteTitleInput');
    titleInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.shiftKey) {
        e.preventDefault();
        titleInput.blur();
      }
    });
    titleInput.addEventListener('change', async () => {
      const val = titleInput.value.trim();
      state.currentNote.title = val || '無題のノート';
      titleInput.value = state.currentNote.title;
      await saveNoteToDB(state.currentNote);
    });

    // ==========================================
    // 7. ノート一覧モーダル (CRUD & モーダル外タップ閉鎖)
    // ==========================================
    const modalOverlay = document.getElementById('notesModalOverlay');
    const modalCard = document.getElementById('notesModalCard');

    async function openNotesModal() {
      state.notes = await getAllNotesFromDB();
      renderNotesList();
      modalOverlay.classList.remove('hidden');
      modalOverlay.classList.add('flex');
    }

    function closeNotesModal() {
      modalOverlay.classList.add('hidden');
      modalOverlay.classList.remove('flex');
    }

    // モーダル外タップで閉じる
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) {
        closeNotesModal();
      }
    });
    modalCard.addEventListener('click', (e) => e.stopPropagation());

    document.getElementById('btnOpenNotes').addEventListener('click', openNotesModal);
    document.getElementById('btnCloseNotesModal').addEventListener('click', closeNotesModal);

    // 新規ノート作成 (Create)
    document.getElementById('btnCreateNewNote').addEventListener('click', async () => {
      const newNote = createEmptyNote(`ノート ${state.notes.length + 1}`);
      await saveNoteToDB(newNote);
      state.currentNote = newNote;
      state.currentPageIndex = 0;
      state.redoStack = [];
      redrawCanvas();
      updateUIState();
      closeNotesModal();
    });

    function renderNotesList() {
      const container = document.getElementById('notesListContainer');
      container.innerHTML = '';

      state.notes.forEach(note => {
        const isCurrent = state.currentNote && note.id === state.currentNote.id;
        const dateStr = new Date(note.updatedAt).toLocaleString('ja-JP', {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const item = document.createElement('div');
        item.className = `flex items-center justify-between p-3.5 rounded-2xl bg-white border transition ${
          isCurrent ? 'border-[#007AFF] ring-1 ring-[#007AFF]/30' : 'border-black/5 hover:border-black/15'
        }`;

        item.innerHTML = `
          <button class="flex-1 text-left min-w-0 pr-3 select-note-btn">
            <div class="flex items-center gap-2">
              <span class="font-semibold text-[16px] text-[#1C1C1E] truncate">${escapeHtml(note.title)}</span>
              ${isCurrent ? '<span class="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-[#007AFF]/10 text-[#007AFF]">編集中</span>' : ''}
            </div>
            <div class="text-[12px] text-[#8E8E93] mt-0.5">
              ${note.pages.length}ページ・更新: ${dateStr}
            </div>
          </button>
          <button class="delete-note-btn hig-btn rounded-xl text-[#FF3B30] hover:bg-[#FF3B30]/10" title="ノートを削除">
            <i data-lucide="trash-2" class="w-5 h-5"></i>
          </button>
        `;

        // ノート切り替え (Read)
        item.querySelector('.select-note-btn').addEventListener('click', () => {
          state.currentNote = note;
          state.currentPageIndex = 0;
          state.redoStack = [];
          redrawCanvas();
          updateUIState();
          closeNotesModal();
        });

        // ノート削除 (Delete)
        item.querySelector('.delete-note-btn').addEventListener('click', async () => {
          if (!confirm(`「${note.title}」を削除しますか？`)) return;
          await deleteNoteFromDB(note.id);
          state.notes = await getAllNotesFromDB();
          if (state.notes.length === 0) {
            const fallback = createEmptyNote('無題のノート');
            await saveNoteToDB(fallback);
            state.notes = [fallback];
          }
          if (state.currentNote.id === note.id) {
            state.currentNote = state.notes[0];
            state.currentPageIndex = 0;
            redrawCanvas();
            updateUIState();
          }
          renderNotesList();
        });

        container.appendChild(item);
      });

      lucide.createIcons();
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[m]));
    }

    // ==========================================
    // 8. 簡易PDF出力 (全ページ一括 A4 PDF化)
    // ==========================================
    function showToast(msg) {
      const toast = document.getElementById('loadingToast');
      document.getElementById('loadingToastText').textContent = msg;
      toast.classList.remove('hidden');
      toast.classList.add('flex');
    }

    function hideToast() {
      const toast = document.getElementById('loadingToast');
      toast.classList.add('hidden');
      toast.classList.remove('flex');
    }

    // オフスクリーンキャンバスに用紙背景＋ストロークを合成してJPEG化
    function renderPageForPdf(page, paperStyle) {
      const offCanvas = document.createElement('canvas');
      offCanvas.width = LOGICAL_WIDTH;
      offCanvas.height = LOGICAL_HEIGHT;
      const oCtx = offCanvas.getContext('2d');

      // 白背景
      oCtx.fillStyle = '#FFFFFF';
      oCtx.fillRect(0, 0, LOGICAL_WIDTH, LOGICAL_HEIGHT);

      // 用紙罫線・方眼の描画
      if (paperStyle === 'grid') {
        oCtx.strokeStyle = 'rgba(0, 122, 255, 0.14)';
        oCtx.lineWidth = 1;
        const step = 40;
        for (let x = step; x < LOGICAL_WIDTH; x += step) {
          oCtx.beginPath(); oCtx.moveTo(x, 0); oCtx.lineTo(x, LOGICAL_HEIGHT); oCtx.stroke();
        }
        for (let y = step; y < LOGICAL_HEIGHT; y += step) {
          oCtx.beginPath(); oCtx.moveTo(0, y); oCtx.lineTo(LOGICAL_WIDTH, y); oCtx.stroke();
        }
      } else if (paperStyle === 'ruled') {
        oCtx.strokeStyle = 'rgba(0, 122, 255, 0.18)';
        oCtx.lineWidth = 1.2;
        const step = 52;
        for (let y = step * 2; y < LOGICAL_HEIGHT - step; y += step) {
          oCtx.beginPath(); oCtx.moveTo(60, y); oCtx.lineTo(LOGICAL_WIDTH - 60, y); oCtx.stroke();
        }
      }

      // 手書きストロークを別レイヤーに描画してから合成（消しゴムのdestination-out保護）
      const inkCanvas = document.createElement('canvas');
      inkCanvas.width = LOGICAL_WIDTH;
      inkCanvas.height = LOGICAL_HEIGHT;
      const iCtx = inkCanvas.getContext('2d');
      for (const stroke of page.strokes) {
        renderStroke(iCtx, stroke);
      }

      oCtx.drawImage(inkCanvas, 0, 0);
      return offCanvas.toDataURL('image/jpeg', 0.92);
    }

    document.getElementById('btnExportPdf').addEventListener('click', async () => {
      if (!window.jspdf || !window.jspdf.jsPDF) {
        alert('PDF出力ライブラリの読み込みに失敗しました。ネットワーク接続を確認してください。');
        return;
      }

      showToast('PDFを生成中...');
      // UI描画更新を先に通して体感レイテンシを低減
      await new Promise(r => setTimeout(r, 40));

      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'portrait',
          unit: 'mm',
          format: 'a4'
        });

        const pages = state.currentNote.pages;
        for (let i = 0; i < pages.length; i++) {
          if (i > 0) pdf.addPage();
          const imgData = renderPageForPdf(pages[i], state.currentNote.paperStyle);
          pdf.addImage(imgData, 'JPEG', 0, 0, 210, 297);
        }

        const safeTitle = (state.currentNote.title || 'note').replace(/[\\/:*?"<>|]/g, '_');
        pdf.save(`${safeTitle}.pdf`);
      } catch (err) {
        alert('PDFの生成中にエラーが発生しました: ' + (err?.message || ''));
      } finally {
        hideToast();
      }
    });

    // ==========================================
    // 9. アプリ起動シーケンス
    // ==========================================
    window.addEventListener('resize', resizePaperLayout);

    (async function bootstrap() {
      lucide.createIcons();
      await initDB();
      state.notes = await getAllNotesFromDB();

      if (state.notes.length === 0) {
        const initialNote = createEmptyNote('無題のノート');
        await saveNoteToDB(initialNote);
        state.notes = [initialNote];
      }

      state.currentNote = state.notes[0];
      state.currentPageIndex = 0;
      resizePaperLayout();
      updateUIState();
    })();
  </script>
</body>
</html>
